name: Fotos da Capitu

on:
  schedule:
    - cron: "*/15 * * * *"  # reserva: o GitHub atrasa ou pula execuções; quem chama na hora é o Apps Script
  workflow_dispatch:
  push:                      # mexeu no robô: ele roda uma vez para provar que continua funcionando
    branches: [main]
    paths: ["scripts/foto.py", ".github/workflows/fotos.yml"]

permissions:
  contents: read

concurrency:
  group: fotos
  cancel-in-progress: false

jobs:
  foto:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Garantir o ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Tirar a foto, se houver uma pendente
        run: python3 scripts/foto.py
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          TOKEN_ROBO: ${{ secrets.TOKEN_ROBO }}
